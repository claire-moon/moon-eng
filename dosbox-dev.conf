[sdl]
fullscreen=false
autlock=true

[mixer]
blocksize=512
prebuffer=20

[cpu]
core=dynamic
cycles=auto

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[autoexec]
mount c build/dos/release
c:
@echo off
cls

echo   == MOON ENG 0.1 ==
echo type 'zeus'  to play ZEUS!
echo type 'mdped' to open MDPed
echo type 'tmuse' to open TMuse
